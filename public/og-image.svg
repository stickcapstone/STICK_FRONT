<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a0f1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0f1a"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Border -->
  <rect x="1" y="1" width="1198" height="628" rx="0" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Top label -->
  <text x="72" y="210" font-family="monospace" font-size="18" fill="#3b82f6" letter-spacing="6" text-transform="uppercase">AI FACT-CHECK PLATFORM</text>

  <!-- Main title -->
  <text x="68" y="310" font-family="Georgia, serif" font-size="108" font-weight="900" fill="#f1f5f9" letter-spacing="6">VERI</text>
  <text x="388" y="310" font-family="Georgia, serif" font-size="108" font-weight="900" fill="#3b82f6" letter-spacing="6">WEB</text>

  <!-- Divider line -->
  <rect x="68" y="338" width="480" height="2" rx="1" fill="url(#bar)"/>

  <!-- Description -->
  <text x="68" y="390" font-family="sans-serif" font-size="26" fill="#94a3b8">URL · 이미지 · 영상 신뢰도 분석</text>

  <!-- Score badge -->
  <rect x="68" y="430" width="130" height="44" rx="22" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="133" y="458" font-family="monospace" font-size="16" fill="#3b82f6" text-anchor="middle" letter-spacing="2">신뢰</text>

  <rect x="214" y="430" width="130" height="44" rx="22" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="279" y="458" font-family="monospace" font-size="16" fill="#f59e0b" text-anchor="middle" letter-spacing="2">주의</text>

  <rect x="360" y="430" width="130" height="44" rx="22" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="425" y="458" font-family="monospace" font-size="16" fill="#ef4444" text-anchor="middle" letter-spacing="2">위험</text>

  <!-- Right side score display -->
  <text x="920" y="300" font-family="Georgia, serif" font-size="200" font-weight="900" fill="#1e293b" text-anchor="middle">87</text>
  <text x="920" y="300" font-family="Georgia, serif" font-size="200" font-weight="900" fill="#10b981" text-anchor="middle" opacity="0.9">87</text>
  <text x="920" y="360" font-family="monospace" font-size="20" fill="#64748b" text-anchor="middle" letter-spacing="4">/100</text>

  <!-- Bottom URL -->
  <text x="72" y="590" font-family="monospace" font-size="17" fill="#475569" letter-spacing="2">veriweb.vercel.app</text>
</svg>
